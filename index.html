<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>VOC 流向可视化</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: instrument screen. Camera stage on the left (top on phones), readout panel on the right (below on phones).
   One deliberate dark look: a lab viewer, with a gold accent taken from the Au film itself. */
:root {
  color-scheme: dark;
  --bg: #0d1215;
  --surface: #141b1f;
  --surface-2: #1a2328;
  --line: #27333a;
  --fg: #e4ebe8;
  --muted: #8b9896;
  --gold: #d6a54a;       /* Au film accent: primary actions, ROI frame */
  --gold-ink: #1b1406;
  --live: #4cc2a4;       /* monitoring */
  --alert: #ff6a55;      /* gas detected */
  --ref: #7fb6ff;        /* reference region */
  --font-ui: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Microsoft YaHei", "Yu Gothic UI", "Noto Sans CJK SC", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r: 10px;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 24px;
}
.app { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.au-dot { width: 14px; height: 14px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 35% 35%, #f3d58c, var(--gold) 55%, #8a6420); box-shadow: 0 0 10px rgba(214,165,74,.45); }
.brand h1 { font-size: 18px; margin: 0; font-weight: 650; letter-spacing: .02em; text-wrap: balance; }
.brand .sub { color: var(--muted); font-size: 12px; margin: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.seg button { appearance: none; border: 0; background: transparent; color: var(--muted); font: inherit; font-size: 13px;
  padding: 6px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--fg); font-weight: 600; }
.seg button:focus-visible, .btn:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

main.layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
@media (min-width: 900px) { main.layout { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; } }

.stage { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.srcbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.srcbar .seg button { padding: 7px 14px; }
.caption { color: var(--muted); font-size: 12px; min-width: 0; }
.viewport-wrap { width: 100%; display: flex; justify-content: center; }
.viewport { position: relative; background: #000; border-radius: var(--r); overflow: hidden; max-width: 100%; width: 100%; aspect-ratio: 9 / 16; max-height: 60vh; }
.viewport video, .viewport canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.viewport video { object-fit: fill; }
.viewport canvas { touch-action: none; cursor: crosshair; }
.banner { position: absolute; left: 10px; right: 10px; bottom: 10px; padding: 10px 12px; border-radius: 8px;
  background: rgba(13,18,21,.88); border: 1px solid var(--line); font-size: 13px; line-height: 1.45; }
.hint { color: var(--muted); font-size: 12px; }

.panel { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; }
.status { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border-radius: 999px; font-weight: 600; font-size: 13px;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill[data-phase="baseline"] { color: var(--gold); border-color: rgba(214,165,74,.45); }
.pill[data-phase="live"] { color: var(--live); border-color: rgba(76,194,164,.45); }
.pill[data-phase="detect"] { color: #fff; background: var(--alert); border-color: var(--alert); }
.pill[data-phase="detect"] i { animation: blink 1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }
@media (prefers-reduced-motion: reduce) { .pill[data-phase="detect"] i { animation: none; } }
.progress { height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; margin-top: 10px; }
.progress span { display: block; height: 100%; width: 0; background: var(--gold); transition: width .1s linear; }

.dirrow { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 14px; align-items: center; }
.compass { width: 92px; height: 92px; }
.compass .needle { transition: transform .15s ease-out; transform-origin: 50px 50px; }
@media (prefers-reduced-motion: reduce) { .compass .needle { transition: none; } }
.dirtext .lbl { color: var(--muted); font-size: 12px; }
.dirtext .big { font-family: var(--font-data); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
.dirtext .small { color: var(--muted); font-size: 12px; }

.readouts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 14px; margin: 0; }
.readouts div { min-width: 0; }
.readouts dt { color: var(--muted); font-size: 12px; }
.readouts dd { margin: 0; font-family: var(--font-data); font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { appearance: none; font: inherit; font-weight: 600; font-size: 14px; border-radius: 8px; padding: 9px 14px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); }
.btn.primary { background: var(--gold); border-color: var(--gold); color: var(--gold-ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.chart-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.chart-head h2, .card h2 { font-size: 13px; margin: 0; font-weight: 600; }
.legend { display: flex; gap: 12px; color: var(--muted); font-size: 11px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 2px; margin-right: 5px; vertical-align: middle; background: var(--c); }
#chart { width: 100%; height: 120px; display: block; }

details.settings summary { cursor: pointer; font-weight: 600; font-size: 13px; list-style: none; display: flex; justify-content: space-between; }
details.settings summary::-webkit-details-marker { display: none; }
details.settings summary::after { content: "+"; color: var(--muted); font-family: var(--font-data); }
details.settings[open] summary::after { content: "−"; }
.form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 10px; align-items: center; margin-top: 10px; }
.form label { color: var(--muted); font-size: 13px; }
.form select, .form input[type="number"] { font: inherit; font-size: 13px; color: var(--fg); background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 8px; min-width: 0; }
.form input[type="number"] { width: 84px; font-family: var(--font-data); }
.form .check { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; color: var(--fg); }
.note { color: var(--muted); font-size: 12px; line-height: 1.55; margin: 0; }
.camstat { font-size: 12px; color: var(--muted); }
.camrows { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.camrow { display: grid; grid-template-columns: 88px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.camrow .nm { color: var(--muted); font-size: 13px; }
.camrow input[type="range"] { width: 100%; accent-color: var(--gold); }
.camrow .val { font-family: var(--font-data); font-size: 12px; font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; }
.chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.on { color: var(--gold-ink); background: var(--gold); border-color: var(--gold); }
.chip.no { opacity: .6; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--fg); }
.support { font-size: 12px; color: var(--muted); line-height: 1.55; margin: 8px 0 0; }
.support b { color: var(--fg); font-weight: 600; }
.camstat b { color: var(--fg); font-weight: 600; }
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="au-dot" aria-hidden="true"></span>
      <div>
        <h1 data-i18n="title">VOC 流向可视化</h1>
        <p class="sub" data-i18n="subtitle">LSPR 基板 · 逐帧差分 · 只用当前帧和过去帧</p>
      </div>
    </div>
    <div class="seg" role="group" aria-label="Language">
      <button type="button" id="lang-zh" aria-pressed="true">中文</button>
      <button type="button" id="lang-ja" aria-pressed="false">日本語</button>
    </div>
  </header>

  <main class="layout">
    <section class="stage">
      <div class="srcbar">
        <div class="seg" role="group" aria-label="Source">
          <button type="button" id="src-sample" aria-pressed="true" data-i18n="src_sample">示例视频</button>
          <button type="button" id="src-camera" aria-pressed="false" data-i18n="src_camera">摄像头</button>
          <button type="button" id="src-file" aria-pressed="false" data-i18n="src_file">导入视频</button>
        </div>
        <input type="file" id="file" accept="video/*" hidden>
        <span class="caption" id="caption"></span>
      </div>
      <div class="viewport-wrap">
        <div class="viewport" id="viewport">
          <video id="video" muted playsinline></video>
          <canvas id="overlay" aria-label="ROI"></canvas>
          <div class="banner" id="banner" hidden></div>
        </div>
      </div>
      <div class="hint" data-i18n="hint_roi">拖动金色方框选择基板区域，拖动四角调整大小。</div>
    </section>

    <aside class="panel">
      <div class="card">
        <div class="status">
          <span class="pill" id="pill" data-phase="idle"><i></i><span id="pill-text">待机</span></span>
          <span class="camstat" id="time-readout"></span>
        </div>
        <div class="progress" id="progress" hidden><span id="progress-bar"></span></div>
        <div class="camstat" id="camstat" hidden></div>
      </div>

      <div class="card dirrow">
        <svg class="compass" viewBox="0 0 100 100" aria-hidden="true">
          <circle cx="50" cy="50" r="46" fill="none" stroke="var(--line)" stroke-width="2"></circle>
          <g stroke="var(--muted)" stroke-width="2">
            <line x1="50" y1="6" x2="50" y2="14"></line><line x1="50" y1="86" x2="50" y2="94"></line>
            <line x1="6" y1="50" x2="14" y2="50"></line><line x1="86" y1="50" x2="94" y2="50"></line>
          </g>
          <g class="needle" id="needle" opacity="0.25">
            <polygon points="86,50 58,40 58,60" fill="var(--gold)"></polygon>
            <line x1="50" y1="50" x2="62" y2="50" stroke="var(--gold)" stroke-width="6" stroke-linecap="round"></line>
          </g>
          <circle cx="50" cy="50" r="5" fill="var(--fg)"></circle>
        </svg>
        <div class="dirtext">
          <div class="lbl" id="dir-label">气体流向</div>
          <div class="big" id="dir-big">—</div>
          <div class="small" id="dir-small"></div>
        </div>
      </div>

      <div class="card">
        <dl class="readouts">
          <div><dt data-i18n="lbl_peak">峰值 ΔT</dt><dd id="r-peak">—</dd></div>
          <div><dt data-i18n="lbl_area">响应面积</dt><dd id="r-area">—</dd></div>
          <div><dt data-i18n="lbl_noise">噪声 / 阈值</dt><dd id="r-noise">—</dd></div>
          <div><dt data-i18n="lbl_first">首次检测</dt><dd id="r-first">—</dd></div>
        </dl>
      </div>

      <div class="actions">
        <button type="button" class="btn primary" id="btn-baseline" data-i18n="btn_baseline">校准基线</button>
        <button type="button" class="btn" id="btn-play" data-i18n="btn_pause">暂停</button>
        <button type="button" class="btn" id="btn-reset" data-i18n="btn_reset">重置</button>
      </div>

      <div class="card" id="camcard" hidden>
        <div class="chart-head"><h2 data-i18n="cam_title">相机参数</h2><span class="chip" id="lockchip">—</span></div>
        <div class="camrows" id="camrows"></div>
        <div class="actions" style="margin-top:12px">
          <button type="button" class="btn" id="btn-lock" data-i18n="btn_lock">锁定当前参数</button>
          <button type="button" class="btn" id="btn-auto" data-i18n="btn_auto">恢复自动</button>
        </div>
        <p class="support" id="camsupport"></p>
      </div>

      <div class="card">
        <div class="chart-head">
          <h2 data-i18n="chart_title">响应幅度 |ΔT|（%）</h2>
          <div class="legend">
            <span style="--c: var(--gold)" data-i18n="lg_mean">平均</span>
            <span style="--c: var(--live)" data-i18n="lg_peak">峰值</span>
          </div>
        </div>
        <canvas id="chart"></canvas>
      </div>

      <details class="card settings" id="settings">
        <summary data-i18n="set_title">设置</summary>
        <div class="form">
          <label for="set-channel" data-i18n="set_channel">颜色通道</label>
          <select id="set-channel">
            <option value="r">R</option><option value="g">G</option><option value="b">B</option>
            <option value="gray" data-i18n="opt_gray">灰度</option>
          </select>
          <label for="set-sign" data-i18n="set_sign">响应方向</label>
          <select id="set-sign">
            <option value="neg" data-i18n="opt_neg">变暗（透过率下降）</option>
            <option value="pos" data-i18n="opt_pos">变亮（透过率上升）</option>
            <option value="abs" data-i18n="opt_abs">两者都算</option>
          </select>
          <label for="set-arrow" data-i18n="set_arrow">箭头含义</label>
          <select id="set-arrow">
            <option value="flow" data-i18n="opt_flow">气体流向</option>
            <option value="source" data-i18n="opt_source">指向气源</option>
          </select>
          <label for="set-base" data-i18n="set_base">基线时长（秒）</label>
          <input type="number" id="set-base" min="1" max="20" step="0.1" value="2.8">
          <label for="set-k" data-i18n="set_k">检测阈值（× 噪声）</label>
          <input type="number" id="set-k" min="2" max="12" step="0.5" value="4">
          <label for="set-tau" data-i18n="set_tau">时间平滑 τ（秒）</label>
          <input type="number" id="set-tau" min="0" max="3" step="0.05" value="0.1">
          <label class="check"><input type="checkbox" id="set-ref"> <span data-i18n="set_ref">使用参考区（抵消自动曝光）</span></label>
        </div>
        <p class="note" style="margin-top:10px" data-i18n="set_note">改动设置后会重新采集基线。</p>
      </details>

      <p class="note" data-i18n="note">网页版用于演示：iPhone 的浏览器不能锁定曝光和白平衡，读数仅供参考，正式测量请用 App。</p>
    </aside>
  </main>
</div>

<script type="text/plain" id="sample-mp4"></script>
<script type="text/plain" id="sample-webm"></script>

  $('set-channel').value = cfg.channel; $('set-sign').value = cfg.sign; $('set-arrow').value = cfg.arrowMode;
  $('set-base').value = cfg.baselineSec; $('set-k').value = cfg.k; $('set-tau').value = cfg.tau; $('set-ref').checked = cfg.useRef;
}
function onSetting() {
  const num = (id, lo, hi, d) => { const v = parseFloat($(id).value); return Number.isFinite(v) ? Math.max(lo, Math.min(hi, v)) : d; };
  const before = JSON.stringify([cfg.channel, cfg.sign, cfg.baselineSec, cfg.k, cfg.tau, cfg.useRef]);
  cfg.channel = $('set-channel').value; cfg.sign = $('set-sign').value; cfg.arrowMode = $('set-arrow').value;
  cfg.baselineSec = num('set-base', 1, 20, 2.8); cfg.k = num('set-k', 2, 12, 4); cfg.tau = num('set-tau', 0, 3, 0.1); cfg.useRef = $('set-ref').checked;
  if (JSON.stringify([cfg.channel, cfg.sign, cfg.baselineSec, cfg.k, cfg.tau, cfg.useRef]) !== before) regionChanged(false);
  else { drawOverlay(lastOut); updateDir(lastOut); }
}
for (const id of ['set-channel', 'set-sign', 'set-arrow', 'set-base', 'set-k', 'set-tau', 'set-ref']) $(id).addEventListener('change', onSetting);

function applyLang() {
  document.documentElement.lang = lang === 'ja' ? 'ja' : 'zh-CN';
  document.querySelectorAll('[data-i18n]').forEach(el => { const v = tr(el.dataset.i18n); if (typeof v === 'string') el.textContent = v; });
  $('lang-zh').setAttribute('aria-pressed', String(lang === 'zh')); $('lang-ja').setAttribute('aria-pressed', String(lang === 'ja'));
  $('btn-play').textContent = tr(video.paused && source !== 'camera' ? 'btn_play' : 'btn_pause');
  setCaption(); updateCamStat(); buildCamControls(); drawOverlay(lastOut);
  if (phase !== 'live') setPill(phase); updateDir(lastOut);
}
for (const l of ['zh', 'ja']) $('lang-' + l).addEventListener('click', () => { lang = l; try { localStorage.setItem('gasflow.lang', l); } catch (e) {} applyLang(); });

// test hook (read-only)
window.gasflowDebug = { get state() { return { source, phase, firstDet, baseEnd, noise: engine && engine.noise, grid: [gw, gh],
  arrowFlowDeg: lastOut && lastOut.arrow ? (angleOf(lastOut.arrow) + 180) % 360 : null, frac: lastOut && lastOut.frac, procMs }; } };

const hasSample = document.getElementById('sample-mp4').textContent.trim().length > 100;
$('src-sample').hidden = !hasSample;
applyLang(); syncForm(); layoutStage();
if (hasSample) loadSample();
else { source = 'none'; setSourceButtons(); setCaption(); $('btn-play').disabled = true; $('btn-baseline').disabled = true; showBanner(tr('pick_source')); drawOverlay(null); }
})();
</script>
</body>
</html>
