# Builds GasCam with the newest Xcode on GitHub's macOS runners (your own Mac only needs to
# download the result). Produces an *unsigned* .ipa: sign + install it with your Apple ID
# using a sideloading tool, or use the simulator .app for testing.
name: Build GasCam

on:
  workflow_dispatch:
  push:
    branches: [ gascam-app ]

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build for iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project GasCam.xcodeproj -target GasCam -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build-device.log

      - name: Error summary
        if: failure()
        run: grep -E "error:|fatal error" build-device.log | sort -u | head -100 || true

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/GasCam.app Payload/
          zip -qry GasCam-unsigned.ipa Payload

      - name: Publish build to the gascam-build branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir out
          cp GasCam-unsigned.ipa build-device.log out/
          { xcodebuild -version; echo "source ${GITHUB_SHA}"; date -u; } > out/build-info.txt
          grep -E "warning:" build-device.log | sort -u > out/warnings.txt || true
          cd out
          git init -q -b gascam-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "GasCam build ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gascam-build

      - uses: actions/upload-artifact@v4
        with:
          name: GasCam-unsigned-ipa
          path: GasCam-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build-device.log
